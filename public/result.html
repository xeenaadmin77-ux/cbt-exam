<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examination Result - ITI CBT Portal</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="college-brand">
      <img src="images/xeena_logo.png" alt="XEENA Institute Logo" class="college-logo-img" />
      <div class="college-titles">
        <h1 class="college-name-display">XEENA INSTITUTE OF SKILL DEVELOPMENT</h1>
        <p class="lab-name-display">Computer Based Test (CBT) Examination Lab</p>
      </div>
    </div>
    <div>
      <a href="student-dashboard.html" class="btn btn-sm btn-secondary">Dashboard</a>
    </div>

  <main class="auth-wrapper" id="resultContainer">
    <div style="text-align: center; padding: 40px; color: var(--text-muted);">
      Loading evaluation result from secure server...
    </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/results.js"></script>
