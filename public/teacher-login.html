<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty &amp; Invigilator Login - ITI CBT Portal</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- Header -->
  <header class="top-bar">
    <div class="college-brand">
      <img src="images/xeena_logo.png" alt="XEENA Institute Logo" class="college-logo-img" />
      <div class="college-titles">
        <h1 class="college-name-display">XEENA INSTITUTE OF SKILL DEVELOPMENT</h1>
        <p class="lab-name-display">Faculty &amp; Administration Gateway</p>
      </div>
    </div>
    <div class="lab-info-pill">
      <span>● Invigilator Portal</span>
    </div>
  </header>

  <!-- Login Card -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon">👨‍🏫</div>
        <h2>Faculty &amp; Invigilator Login</h2>
        <p>Sign in to manage test papers, monitor live sessions, and view scorecards</p>
      </div>
      <div class="auth-card-body">
        <div id="authAlert" class="alert alert-danger" style="display: none;"></div>

        <form id="teacherLoginForm" onsubmit="handleTeacherLogin(event)">
          <div class="form-group">
            <label class="form-label" for="teacherEmail">Faculty Email Address</label>
            <input 
              type="email" 
              id="teacherEmail" 
              class="form-control" 
              placeholder="e.g. teacher@xeena.edu or faculty@college.in" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="teacherPassword">Faculty Password</label>
            <input 
              type="password" 
              id="teacherPassword" 
              class="form-control" 
              placeholder="Enter your faculty password" 
              required 
              autocomplete="current-password"
            />
          </div>

          <button type="submit" id="teacherLoginBtn" class="btn btn-primary btn-block btn-lg">
            Sign In to Faculty Portal
          </button>
        </form>

        <div class="auth-footer">
          <p>
            Are you a student taking an exam? <a href="student-login.html">Candidate Sign In</a>
          </p>
          <p style="margin-top: 6px;">
            <a href="index.html">← Back to Portal Home</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
